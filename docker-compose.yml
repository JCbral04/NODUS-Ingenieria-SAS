version: "3.9"

# NODUS — Entorno local de desarrollo
# Uso:  docker compose up -d        (solo base de datos)
#       docker compose logs -f db

services:
  db:
    image: postgres:16-alpine
    container_name: nodus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodus
      POSTGRES_PASSWORD: nodus
      POSTGRES_DB: nodus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodus -d nodus"]
      interval: 5s
      timeout: 5s
      retries: 10

